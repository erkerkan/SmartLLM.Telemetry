name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SmartLLM.Telemetry.sln

      - name: Build
        run: dotnet build SmartLLM.Telemetry.sln -c Release --no-restore

      - name: Test
        run: dotnet test SmartLLM.Telemetry.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack SmartLLM.Telemetry.sln -c Release --no-build -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ matrix.os }}
          path: ./artifacts/*.nupkg
